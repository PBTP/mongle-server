replicaCount: 1

namespace: default

image:
  repository: ${AWS_ACCOUNT_ID}.dkr.ecr.ap-northeast-2.amazonaws.com/mgmg
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ecr-secret

nameOverride: ""
fullnameOverride: ""

nodeSelector:
  node-role.kubernetes.io/worker: "true"

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  hosts:
    - host: api.mgmg.life
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: cert-wildcard
      hosts:
        - api.mgmg.life

env:
  - name: NODE_ENV
    value: "dev"
  - name: LOG_LEVEL
    value: "info"

configMap:
  name: mgmg-env
  mountPath: /app/config 